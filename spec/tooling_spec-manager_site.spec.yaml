specs:
  - id: tooling_spec-manager_site_change-filter
    description: The filter bar has a 'Has proposed change' toggle that leaves only specs whose meta
      carries a supported change (meta.change), and it combines with the status, taxonomy, text, and
      feedback filters.
    motivation: The user reviews just the specs with proposed changes without scrolling the whole list.
    acceptance_criteria:
      - Turning on the toggle leaves only specs that have a meta.change.
      - The toggle applies together with the status, taxonomy, text, and feedback filters.
      - Turning the toggle off restores the list subject to the remaining filters.
    status: done

  - id: tooling_spec-manager_site_change-notes
    description: "Every field shown in a Proposed change section (description, motivation, and each
      acceptance criterion delta) has the same auto-saving follow-up note textarea, indicator,
      highlight, and 'Feedback addressed' button as a spec field, and its notes are stored under a
      change: key on the spec's item in spec/spec_follow_up.yaml."
    motivation: Proposed changes need the same discussion with the spec curator agent as the spec
      itself, and keeping their notes separate from the spec's notes shows which one the feedback is
      about.
    acceptance_criteria:
      - "Typing in a change note saves it to the change: object of the spec's item in
        spec/spec_follow_up.yaml, with the same pending and saved indicators as spec notes."
      - Change criterion notes are keyed by the change's acceptance_criteria key (0, 1, new1, ...),
        and a key that is not in the spec's meta.change is rejected.
      - Notes on the change never alter or overwrite the spec's own notes, and the reverse.
      - "Clearing a change note, or pressing 'Feedback addressed', removes it from the change:
        object, and the change: object when it is empty."
    status: done

  - id: tooling_spec-manager_site_change-status
    description: The Proposed change section shows its change_status as radio buttons (pending,
      approved), like a spec's status, and selecting one saves it to the spec's
      meta.change.change_status in its leaf file.
    motivation: The user approves or reverts a proposed change directly in the site, so it becomes
      eligible for implementation without running the CLI.
    acceptance_criteria:
      - The section shows a pending and an approved radio button with the current change_status
        selected, plus its badge.
      - Selecting the other option updates the badge right away and sets meta.change.change_status
        in the spec's leaf file, leaving every other field of the spec unchanged.
      - A failed save reverts the selection to the stored change_status.
      - Only pending and approved are accepted, and a spec without a meta.change is rejected.
    status: done

  - id: tooling_spec-manager_site_change-view
    description: "A spec whose meta carries a supported change (meta.change) shows a 'Proposed change'
      section under the spec, rendered like a spec of its own: the change_status badge, the
      replacement description and motivation when present, and each acceptance_criteria delta
      labeled as a replacement (#N), an addition (add), or a removal."
    motivation: Reviewers see proposed changes to accepted or done specs in the same place as the spec,
      so they can read and react to them without opening the spec files.
    acceptance_criteria:
      - A spec with a meta.change shows a Proposed change section with its change_status badge; a
        spec without one shows none.
      - Only the supported change fields (description, motivation, acceptance_criteria,
        change_status) are rendered; description and motivation appear only when the change replaces
        them.
      - Each acceptance_criteria key is listed in order (numeric indexes ascending, then new1, new2,
        ...), a false value being shown as a removal.
    status: done

  - id: tooling_spec-manager_site_feedback-addressed
    description: Below each follow-up note textarea a 'Feedback addressed' button, with help text saying
      it clears the note, empties that textarea and deletes its entry from spec/spec_follow_up.yaml
      exactly as if the user had deleted the text.
    motivation: Once the spec curator agent has dealt with a note, the user can retire it in one click
      instead of selecting and deleting its text.
    acceptance_criteria:
      - Clicking the button empties the associated textarea.
      - The corresponding field is removed from spec/spec_follow_up.yaml immediately, with the item
        and the file removed when nothing is left, as when the text is deleted by hand.
      - The button is disabled while the textarea is empty.
    status: done

  - id: tooling_spec-manager_site_feedback-filter
    description: The filter bar has a 'Has feedback' toggle that leaves only specs with at least one
      follow-up note in spec/spec_follow_up.yaml (description, motivation, any acceptance criterion,
      or any note on the spec's proposed change), and it combines with the status, taxonomy, and
      text filters.
    motivation: The user reviews just the specs they left feedback on, for example to walk through them
      with the spec curator agent, without scrolling the whole list.
    acceptance_criteria:
      - Turning on the toggle leaves only specs that have a follow-up note under them, including
        notes on their proposed change.
      - The toggle applies together with the status, taxonomy, and text filters.
      - Turning the toggle off restores the list subject to the remaining filters.
    status: done
    meta:
      history:
        - diff: 1
          change:
            description: The filter bar has a 'Has feedback' toggle that leaves only specs with at least one
              follow-up note in spec/spec_follow_up.yaml (description, motivation, any acceptance
              criterion, or any note on the spec's proposed change), and it combines with the
              status, taxonomy, and text filters.
            acceptance_criteria:
              "0": Turning on the toggle leaves only specs that have a follow-up note under them, including notes
                on their proposed change.
            change_status: approved

  - id: tooling_spec-manager_site_feedback-highlight
    description: A follow-up note textarea that holds text is visually called out (amber border and
      tint) so the user can see at a glance where feedback was provided; empty textareas keep the
      default look.
    motivation: Feedback lives in many textareas across many specs, and the user needs to spot which
      ones carry notes without reading every field.
    acceptance_criteria:
      - A textarea with text, whether loaded from spec/spec_follow_up.yaml or just typed, is
        rendered with a distinct highlight.
      - A textarea with no text has no highlight, and the highlight disappears when the text is
        cleared.
    status: done

  - id: tooling_spec-manager_site_filters
    description: A filter bar along the top of the page can filter by taxonomy value, by status, and by
      free text matched against a spec's id, description, motivation, or any acceptance criterion.
    motivation: The user reviews specs in batches - by area of the store, by state, or by topic -
      instead of scrolling the whole list.
    acceptance_criteria:
      - Filtering by status leaves only specs carrying that status.
      - Filtering by taxonomy value leaves only specs within that taxonomy branch.
      - A text query leaves only specs whose id, description, motivation, or any acceptance
        criterion contains the query text; matching is case-insensitive.
      - Multiple active filters apply together, and clearing a filter restores the full list.
      - The taxonomy filter's dropdown trigger is sized to fit the longest option in the list, not
        just the currently selected value, so every option's label is fully visible when selected.
    status: done

  - id: tooling_spec-manager_site_follow-up-file
    description: "spec/spec_follow_up.yaml stores follow-up notes as a root items: list; each item has
      an id (required, matching the spec id), an optional description string, an optional motivation
      string, an optional acceptance_criteria object with numeric index keys and string values, and
      an optional change object holding the same three note fields for the spec's proposed change
      (its acceptance_criteria keyed by the meta.change criterion keys such as 0 or new1); items are
      sorted by spec id; an id appears in the file only while it carries at least one follow-up
      field, and the file is deleted when its last item is removed."
    motivation: A stable, predictable file format lets the spec curator agent read the user's feedback
      and discuss it without parsing ad-hoc structure.
    acceptance_criteria:
      - The file's top-level key is items:, a list of objects, and each object's id matches an
        existing spec id.
      - Only id is required; description and motivation are optional strings, acceptance_criteria is
        an optional object mapping numeric index keys to string values, and change is an optional
        object with the same optional fields, whose acceptance_criteria keys are the keys of the
        spec's meta.change.acceptance_criteria.
      - The items list is sorted by spec id.
      - An id's item is removed from the file when all of its follow-up fields, including those
        under change, are cleared.
      - When the last item is removed, spec/spec_follow_up.yaml is deleted.
    status: done
    meta:
      history:
        - diff: 1
          change:
            description: "spec/spec_follow_up.yaml stores follow-up notes as a root items: list; each item has
              an id (required, matching the spec id), an optional description string, an optional
              motivation string, an optional acceptance_criteria object with numeric index keys and
              string values, and an optional change object holding the same three note fields for
              the spec's proposed change (its acceptance_criteria keyed by the meta.change criterion
              keys such as 0 or new1); items are sorted by spec id; an id appears in the file only
              while it carries at least one follow-up field, and the file is deleted when its last
              item is removed."
            acceptance_criteria:
              "1": Only id is required; description and motivation are optional strings, acceptance_criteria is an
                optional object mapping numeric index keys to string values, and change is an
                optional object with the same optional fields, whose acceptance_criteria keys are
                the keys of the spec's meta.change.acceptance_criteria.
              "3": An id's item is removed from the file when all of its follow-up fields, including those under
                change, are cleared.
            change_status: approved

  - id: tooling_spec-manager_site_follow-up-notes
    description: Below each spec's description, motivation, and each acceptance criterion, a shadcn
      textarea collects questions, concerns, and instructions for the spec curator agent; typed text
      auto-saves to spec/spec_follow_up.yaml on blur or after 5 seconds of inactivity, with a yellow
      pending indicator while typing that turns into a green checkmark once saved; Enter inserts a
      line break, and the textarea grows vertically so all typed text stays visible.
    motivation: The notes capture the user's feedback for a later discussion with the spec curator
      agent, and auto-save records the feedback without any explicit save action; multi-line entry
      with a vertically growing field keeps longer feedback comfortable to write and fully visible.
    acceptance_criteria:
      - While the user is typing, a yellow pending indicator is shown to the right of the textarea.
      - When the textarea loses focus or 5 seconds of inactivity pass, the text is saved to
        spec/spec_follow_up.yaml and the indicator becomes a green checkmark; pressing Enter inserts
        a newline rather than saving, so the field can hold multi-line text.
      - If the user clears a textarea and the save fires, the corresponding field is removed from
        that item in spec/spec_follow_up.yaml, and the item is removed when its last field is
        cleared.
      - The textarea grows vertically as text is entered, so all typed text, including line breaks,
        is visible without scrolling.
    status: done

  - id: tooling_spec-manager_site_git-pending-filter
    description: The filter bar has a 'Pending git changes' toggle that leaves only specs that differ
      from HEAD in the Git workspace (staged, unstaged, or in an untracked spec file), and it
      combines with the status, taxonomy, text, feedback, and proposed-change filters.
    motivation: The user reviews just the specs that are about to be committed without scrolling the
      whole list.
    acceptance_criteria:
      - Turning on the toggle leaves only specs whose entry is new or changed relative to HEAD,
        whether the change is staged or unstaged.
      - Specs in an untracked spec file all count as pending git changes.
      - Specs in a modified leaf file that were not themselves changed are not shown by the toggle.
      - The toggle applies together with the status, taxonomy, text, feedback, and proposed-change
        filters.
      - Turning the toggle off restores the list subject to the remaining filters.
      - When the project is not in a Git repository, the toggle leaves no specs.
    status: done

  - id: tooling_spec-manager_site_grouped-view
    description: The page displays all specs sorted by id and grouped by their taxonomy; each named
      taxonomy layer level can be collapsed or expanded to hide or show all spec ids under it, and
      each spec item can be collapsed by its id to show only the spec id with its details hidden.
    motivation: The taxonomy gives the user a navigable outline of the store, and collapsing - by layer
      or by individual spec - keeps the view manageable as the store grows.
    acceptance_criteria:
      - Spec ids are listed in ascending order by id.
      - Specs are grouped under their taxonomy path (area, component, section).
      - Collapsing a layer hides all spec ids under it, and expanding restores them.
      - Collapsing a spec item by its id shows only the spec id with none of its details (status,
        description, motivation, acceptance criteria, follow-up notes), and expanding restores the
        details; spec items are expanded by default.
    status: done

  - id: tooling_spec-manager_site_launch
    description: The spec-manager skill ships a spec-manage-site.sh script that launches the spec viewer
      and editor site on 0.0.0.0 port 8080, and must be run from a project root where spec/ exists.
    motivation: Binding to all IPv4 interfaces makes the site reachable through container port
      forwarding while the host can still restrict the published port to loopback.
    acceptance_criteria:
      - Running bash agents/skills/spec-manager/spec-manage-site.sh from a repo root with a spec/
        folder starts a server, and GET http://127.0.0.1:8080/ returns the site with HTTP 200.
      - The server binds to 0.0.0.0 on port 8080 so it is reachable through container port
        forwarding.
      - Running the script from a directory without a spec/ folder exits non-zero with an error
        message.
    status: done
    meta:
      history:
        - diff: 1
          change:
            description: The spec-manager skill ships a spec-manage-site.sh script that launches the spec viewer
              and editor site on 0.0.0.0 port 8080, and must be run from a project root where spec/
              exists.
            motivation: Binding to all IPv4 interfaces makes the site reachable through container port
              forwarding while the host can still restrict the published port to loopback.
            acceptance_criteria:
              "1": The server binds to 0.0.0.0 on port 8080 so it is reachable through container port forwarding.
            change_status: approved

  - id: tooling_spec-manager_site_live-data
    description: The site reads its data from the spec/ folder of the repo it was launched from (the
      leaf spec files, spec/.config.yaml, and spec/spec_follow_up.yaml) and watches the filesystem,
      pushing changes to the open page.
    motivation: The on-disk spec store is the source of truth, so the page must show the current state
      even while agents edit files behind it.
    acceptance_criteria:
      - On load, the page shows every spec from the spec/ leaf files, with follow-up notes from
        spec/spec_follow_up.yaml where present.
      - Editing a spec file or spec/spec_follow_up.yaml on disk while the page is open updates the
        displayed data within a few seconds without a manual page reload.
    status: done

  - id: tooling_spec-manager_site_port
    description: The spec-manage-site.sh script defaults to port 8080 and accepts a --port <X> flag to
      override it (e.g. spec-manage-site.sh --port 3003); a 'Tip:' line about the flag is printed
      after the site URL once the site is up, and is also printed when the server cannot start
      because the port is already in use.
    motivation: A user who hits a port conflict immediately sees how to pick a different port and retry.
    acceptance_criteria:
      - Running spec-manage-site.sh with no --port flag binds to 0.0.0.0:8080 and prints the
        loopback site URL followed by a 'Tip:' line mentioning the --port flag.
      - Running spec-manage-site.sh --port 3003 binds to 0.0.0.0:3003.
      - When the port is already in use and the server fails to start, the output includes a 'Tip:'
        line mentioning the --port flag.
    status: done
    meta:
      history:
        - diff: 1
          change:
            acceptance_criteria:
              "0": Running spec-manage-site.sh with no --port flag binds to 0.0.0.0:8080 and prints the loopback
                site URL followed by a 'Tip:' line mentioning the --port flag.
              "1": Running spec-manage-site.sh --port 3003 binds to 0.0.0.0:3003.
            change_status: approved

  - id: tooling_spec-manager_site_stack
    description: "The site is a Next.js app run with bun: the React UI renders the specs and Next.js
      serves the app and its API routes, and the look is the shadcn preset b6ok544un2."
    motivation: Next.js gives one TypeScript codebase for UI and server-side data handling, bun is the
      runtime, and the shadcn preset fixes the component set and visual theme up front.
    acceptance_criteria:
      - The site is a Next.js application whose dev server is run with bun.
      - The UI is TypeScript React with the shadcn preset b6ok544un2 applied, either via bunx --bun
        shadcn@latest init --preset b6ok544un2 --template next or a standard Next.js template
        followed by bunx --bun shadcn@latest apply --preset b6ok544un2.
      - The site's app code lives inside the spec-manager skill directory, next to
        spec-manage-site.sh.
    status: done

  - id: tooling_spec-manager_site_status-edit
    description: Each spec is shown in its own shadcn item with its id, a status radio group, its
      description, its motivation, and its list of acceptance criteria; changing the radio value
      updates that spec's status in its spec.yaml file.
    motivation: Status is the only field written back to the canonical store, so the user can mark a
      spec approved from the page and the spec store stays the single source of truth.
    acceptance_criteria:
      - The status radio group offers one option per status configured in spec/.config.yaml.
      - Selecting a status in the UI writes the new status into that spec's leaf spec.yaml file on
        disk.
      - After the change, both the on-disk file and the UI show the new status.
      - The 'status' label and its radio group are placed directly under the spec id, aligned to the
        left side of the item.
    status: done

  - id: tooling_spec-manager_site_uat
    description: "The site ships automated user acceptance tests (UAT) that run against a test repo: the
      tests start the site, drive it like a user (change a spec's status, type follow-up text into a
      few fields across a few spec ids, and save), and verify the changes landed on disk."
    motivation: The UAT exercises the site end-to-end the way a real reviewer would, and proves edits
      reach the files on disk - the whole point of the tool - while a throwaway test repo keeps the
      tests from mutating the real spec store.
    acceptance_criteria:
      - "The UAT runs against a test repo: a fixture spec/ store checked in with the site's tests,
        copied into a scratch directory per run, and separate from the repo's real spec store."
      - The UAT starts spec-manage-site.sh against the test repo and loads the site in a headless
        browser.
      - The UAT changes a spec's status through the status radio in the UI and asserts the
        corresponding spec.yaml file in the test repo on disk carries the new status.
      - The UAT types follow-up text into fields of at least two spec ids, covering multiple field
        types (description, motivation, and acceptance criterion), triggers the save, and asserts
        spec_follow_up.yaml in the test repo contains an item per touched spec id with the typed
        text and items sorted by id.
      - The UAT is fully automated - no manual steps - and runs as part of the site's automated test
        suite.
    status: done
