specs:
  - id: isolation_script_output_ls-running-projects
    description: The ls command lists all currently running dev project containers.
    motivation: Users need to see which agent containers are running and their status without digging
      through docker ps.
    acceptance_criteria:
      - When no dev project containers are running, the command prints 'No running dev project
        containers.'
    status: done

  - id: isolation_script_output_next-steps
    description: On success, the up command prints a bullet summary of what it did, including the herdr
      machine add command.
    motivation: Users need to know what the tool did and the exact herdr registration to use the
      container; nested herdr sessions are not allowed, so the host herdr must register the
      container.
    acceptance_criteria:
      - The output is a bulleted list describing what the tool did.
      - The output includes herdr machine add dev-<project> --label "<project>".
    status: done

  - id: isolation_script_output_ssh-config
    description: The up command adds or updates the host's entry in ~/.ssh/config itself instead of
      printing it for the user to add.
    motivation: The user should be able to ssh to the container immediately after up without editing
      config by hand.
    acceptance_criteria:
      - After a successful up, ~/.ssh/config contains a Host <compose-project> block with the host's
        port and IdentityFile.
      - If an entry for the host already exists, it is updated in place with the current port.
    status: done

  - id: isolation_script_output_web-port
    description: On success, the up command prints the web base URL for the container's port 8080.
    motivation: Users need the exact URL to open the container's web server in a browser and verify site
      behavior.
    acceptance_criteria:
      - The output includes http://127.0.0.1:<web-port>/ where <web-port> is the SSH port + 6.
    status: done
