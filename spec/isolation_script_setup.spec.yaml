specs:
  - id: isolation_script_setup_derives-project
    description: dev-repo up derives the project name from the working directory and creates the
      worktrees directory.
    motivation: Each project is laid out as <project>/main plus <project>/worktrees, so the script can
      derive the project from the layout instead of taking it as an argument.
    acceptance_criteria:
      - up creates <project>/worktrees next to main if it does not already exist.
    status: done

  - id: isolation_script_setup_requires-ssh-key
    description: dev-repo up exits with an error if the SSH public key file does not exist.
    motivation: The container accepts only that public key, so starting a container without the key
      would make it unreachable.
    acceptance_criteria:
      - SSH_PUBLIC_KEY=/path/to/key.pub overrides the default key path.
    status: done

  - id: isolation_script_setup_up-all-recreates
    description: The up --all command recreates all running dev project containers.
    motivation: Users want to refresh every running agent container at once, for example after changing
      the Dockerfile or config files, without starting each project by hand.
    acceptance_criteria:
      - When no dev project containers are running, the command prints 'No running dev project
        containers.'
    status: done

  - id: isolation_script_setup_validates-args
    description: dev-repo up validates its argument and working directory before running docker compose.
    motivation: The compose project name is derived from the folder layout and must be a safe
      identifier, the host SSH port must be a valid user port, and the script only works when
      invoked from the correct location.
    acceptance_criteria:
      - An unknown command prints usage and exits non-zero.
    status: done
