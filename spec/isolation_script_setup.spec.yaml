specs:
  - id: isolation_script_setup_auto-ports
    description: dev-repo up auto-assigns host ports and encodes the port range start in the compose
      project name.
    motivation: Users should not have to pick ports; the fixed scheme (SSH 2202/2212/... with web six
      above) keeps port pairs predictable, and reading the ranges in use from existing container
      names makes assignment conflict-free.
    acceptance_criteria:
      - When no container exists for the project, up picks the first range start at or above 2200 in
        increments of 10 (2200, 2210, 2220, ...) not used by another dev container, running or not,
        names the compose project dev-<project>-<range-start>, and maps range start + 2 to container
        port 22 and range start + 8 to container port 8080.
      - When a container already exists for the project, up recreates it with the same ports.
    status: done

  - id: isolation_script_setup_derives-project
    description: dev-repo up derives the project name from the working directory and creates the
      worktrees directory.
    motivation: Each project is laid out as <project>/main plus <project>/worktrees, so the script can
      derive the project from the layout instead of taking it as an argument.
    acceptance_criteria:
      - up creates <project>/worktrees next to main if it does not already exist.
    status: done

  - id: isolation_script_setup_down-confirms
    description: The down command tears down the project's compose stack, including its volumes, after a
      yes/no confirmation.
    motivation: Tearing down a container loses the opencode session, the SSH host key, and container
      files outside /workspace, so the user must explicitly confirm what will be destroyed.
    acceptance_criteria:
      - "down prints a warning naming the container that will be destroyed and listing what will be
        lost: the opencode session information, the SSH host key, and files not under /workspace,
        along with the host folder /workspace maps to."
      - Without a yes answer, down tears nothing down.
      - With a yes answer, down runs docker compose down with volume removal for the project.
    status: done

  - id: isolation_script_setup_requires-ssh-key
    description: dev-repo up exits with an error if the SSH public key file does not exist.
    motivation: The container accepts only that public key, so starting a container without the key
      would make it unreachable.
    acceptance_criteria:
      - SSH_PUBLIC_KEY=/path/to/key.pub overrides the default key path.
    status: done

  - id: isolation_script_setup_up-all-recreates
    description: The up --all command recreates all running dev project containers.
    motivation: Users want to refresh every running agent container at once, for example after changing
      the Dockerfile or config files, without starting each project by hand.
    acceptance_criteria:
      - When no dev project containers are running, the command prints 'No running dev project
        containers.'
    status: done

  - id: isolation_script_setup_validates-args
    description: dev-repo up takes no port argument and validates its working directory before running
      docker compose.
    motivation: The compose project name is derived from the folder layout and must be a safe
      identifier, the host ports are assigned automatically, and the script only works when invoked
      from the correct location.
    acceptance_criteria:
      - An unknown command prints usage and exits non-zero.
      - up with a port argument prints usage and exits non-zero.
    status: done
